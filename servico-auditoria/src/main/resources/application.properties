server.port=8080

spring.application.name=servico-auditoria

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongouser:mongo123@localhost:27017/auditoria?authSource=admin}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:rabbit}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:rabbit}
spring.data.web.pageable.one-indexed-parameters=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/java-the-hutt}

management.endpoints.web.exposure.include=health,info