server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # Aponta pro Keycloak do seu compose (de fora do Docker: localhost:8081)
          issuer-uri: http://localhost:8081/realms/java-the-hutt

  cloud:
    gateway:
      routes:
        - id: servico-gestao
          uri: ${GATEWAY_ROUTE_GESTAO_URI:http://localhost:8082}
          predicates:
            - Path=/gestao/**
          filters:
            - StripPrefix=1
            - TokenRelay=   # <-- propaga o Bearer token

        - id: servico-apontamento
          uri: ${GATEWAY_ROUTE_APONTAMENTO_URI:http://localhost:8083}
          predicates:
            - Path=/apontamento/**
          filters:
            - StripPrefix=1
            - TokenRelay=

        - id: servico-auditoria
          uri: ${GATEWAY_ROUTE_AUDITORIA_URI:http://localhost:8084}
          predicates:
            - Path=/auditoria/**
          filters:
            - StripPrefix=1
            - TokenRelay=