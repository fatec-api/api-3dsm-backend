spring.application.name=servico-gestao
server.port=8080

# mysql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/gestao_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MariaDB
#spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/gestao_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
#spring.datasource.username=root
#spring.datasource.password=123123
#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SEGURANCA (OAuth2 Resource Server)
# Se estiver a usar um Identity Provider (ex: Keycloak ou Auth0), indique a URI do emissor:
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://localhost:8081/realms/java-the-hutt
# para rodar localmente:
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/java-the-hutt/protocol/openid-connect/certs
# para rodar na docker:
# O Spring usa essa URL para baixar as chaves e validar se o JWT é legitimo
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/java-the-hutt}

# Opcional: Logs detalhados caso o token seja rejeitado
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}


# Ou, se tiver a chave publica localmente:
# spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.key

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:rabbit}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:rabbit}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}

